<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bijou Schmidt</title>
<meta name="description" content="Music and merchandise from Bijou Schmidt.">
<meta property="og:title" content="Bijou Schmidt">
<meta property="og:description" content="Music and merchandise from Bijou Schmidt.">
<meta name="theme-color" content="#0b0b0c">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0b0b0c;
    --bg-2: #151517;
    --line: #2c2c31;
    --text: #f5f2eb;
    --text-2: #cfcbc2;
    --accent: #f0b64a;
    --ink: #171105;
    --size: clamp(190px, min(33svh, 74vw), 440px);
    --font: "Inter", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  * { box-sizing: border-box; margin: 0; }
  html { scroll-behavior: smooth; }
  body {
    background: var(--bg);
    color: var(--text);
    font: 400 18px/1.6 var(--font);
    -webkit-font-smoothing: antialiased;
  }
  a { color: inherit; }
  :focus-visible { outline: 3px solid var(--accent); outline-offset: 3px; border-radius: 4px; }
  .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

  header {
    position: fixed; inset: 0 0 auto 0; z-index: 10;
    display: flex; justify-content: flex-end; align-items: center;
    padding: 18px clamp(20px, 4vw, 48px);
    background: linear-gradient(var(--bg) 40%, transparent);
  }
  .hero-logo { width: min(780px, 90vw); line-height: 0; color: var(--text); }
  .logo-svg { display: block; width: 100%; height: auto; }
  nav { display: flex; gap: clamp(18px, 3vw, 36px); }
  nav a { text-decoration: none; color: var(--text-2); font-size: 17px; padding: 6px 0; border-bottom: 2px solid transparent; }
  nav a:hover { color: var(--text); border-color: var(--accent); }

  .hero {
    min-height: 100svh;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: clamp(16px, 3svh, 32px);
    padding: 72px 20px 32px;
    text-align: center;
  }
  .stage {
    position: relative; width: var(--size); aspect-ratio: 1;
    transform: perspective(900px) rotateX(var(--rx, 0deg)) rotateY(var(--ry, 0deg));
    transition: transform 0.25s ease-out;
  }
  .record {
    position: absolute; inset: 0; border-radius: 50%;
    background:
      repeating-radial-gradient(circle, #101012 0 2px, #1a1a1d 2px 3px);
    box-shadow: 0 0 0 1px #34343a, 0 30px 80px rgba(0,0,0,0.7), 0 0 120px rgba(240,182,74,0.07);
    will-change: transform;
  }
  .record::before {
    content: ""; position: absolute; inset: 7%; border-radius: 50%;
    border: 1px solid rgba(255,255,255,0.05);
    box-shadow: 0 0 0 calc(var(--size) * 0.06) rgba(255,255,255,0.015);
  }
  .label {
    position: absolute; inset: 33%; border-radius: 50%;
    background: var(--accent); color: var(--ink);
    display: flex; justify-content: center; align-items: flex-start; text-align: center;
    font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase;
    font-size: max(10px, calc(var(--size) * 0.032));
    line-height: 1.2; padding: 17% 10% 0;
  }
  .label::after {
    content: ""; position: absolute; left: 50%; top: 50%;
    width: 9%; aspect-ratio: 1; transform: translate(-50%, -50%);
    border-radius: 50%; background: var(--bg);
  }
  .sheen {
    position: absolute; inset: 0; border-radius: 50%; pointer-events: none;
    background: conic-gradient(from 20deg,
      transparent 0 8%, rgba(255,255,255,0.12) 14%, transparent 22% 58%,
      rgba(255,255,255,0.09) 64%, transparent 72% 100%);
  }

  .now { width: min(560px, 100%); display: grid; gap: 14px; justify-items: center; }
  .now h1 { font-size: clamp(26px, 4.5vw, 38px); line-height: 1.15; font-weight: 600; letter-spacing: -0.01em; }
  .now .by { color: var(--text-2); font-size: 17px; margin-top: -8px; }
  .controls { display: flex; align-items: center; gap: 22px; }
  .ico {
    width: 52px; height: 52px; border-radius: 50%; border: 1.5px solid var(--line);
    background: transparent; color: var(--text); cursor: pointer;
    display: grid; place-items: center;
  }
  .ico:hover { border-color: var(--text-2); }
  .ico svg { width: 22px; height: 22px; fill: currentColor; }
  .play { width: 72px; height: 72px; background: var(--accent); border-color: var(--accent); color: var(--ink); }
  .play:hover { background: #ffc864; border-color: #ffc864; }
  .play svg { width: 28px; height: 28px; }
  .play .pause { display: none; }
  .is-playing .play .pause { display: block; }
  .is-playing .play .tri { display: none; }

  .seek { display: grid; grid-template-columns: 48px 1fr 48px; gap: 12px; align-items: center; width: 100%; font-size: 15px; color: var(--text-2); font-variant-numeric: tabular-nums; }
  input[type=range] { -webkit-appearance: none; appearance: none; width: 100%; height: 28px; background: transparent; cursor: pointer; }
  input[type=range]::-webkit-slider-runnable-track { height: 4px; border-radius: 2px; background: linear-gradient(to right, var(--accent) var(--p, 0%), var(--line) var(--p, 0%)); }
  input[type=range]::-moz-range-track { height: 4px; border-radius: 2px; background: var(--line); }
  input[type=range]::-moz-range-progress { height: 4px; border-radius: 2px; background: var(--accent); }
  input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 16px; height: 16px; border-radius: 50%; background: var(--text); margin-top: -6px; border: 0; }
  input[type=range]::-moz-range-thumb { width: 16px; height: 16px; border-radius: 50%; background: var(--text); border: 0; }
  .msg { min-height: 1.5em; color: var(--accent); font-size: 15px; }

  section { padding: clamp(64px, 10vw, 120px) clamp(20px, 5vw, 64px); max-width: 1100px; margin: 0 auto; }
  h2 { font-size: clamp(28px, 4vw, 40px); font-weight: 600; letter-spacing: -0.01em; margin-bottom: 28px; }
  .lead { color: var(--text-2); margin: -12px 0 28px; max-width: 52ch; }


  .links { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 28px; }
  .links a {
    text-decoration: none; padding: 10px 18px; border: 1.5px solid var(--line); border-radius: 999px; font-size: 16px;
  }
  .links a:hover { border-color: var(--accent); color: var(--accent); }

  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 28px; }
  .card { display: grid; gap: 14px; align-content: start; }
  .media {
    aspect-ratio: 1; background: var(--bg-2); border: 1px solid var(--line); border-radius: 12px;
    display: grid; place-items: center; overflow: hidden;
    font-size: 72px; font-weight: 600; color: #34343a;
  }
  .media img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .card h3 { font-size: 20px; font-weight: 600; }
  .card p { color: var(--text-2); font-size: 16px; margin-top: -8px; }
  .buy { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  .price { font-size: 20px; font-variant-numeric: tabular-nums; }
  .btn {
    text-decoration: none; background: var(--accent); color: var(--ink); font-weight: 600; font-size: 16px;
    padding: 10px 22px; border-radius: 999px;
  }
  .btn:hover { background: #ffc864; }

  footer { border-top: 1px solid var(--line); padding: 56px clamp(20px, 5vw, 64px) 72px; text-align: center; color: var(--text-2); }
  footer a { color: var(--text); text-underline-offset: 4px; }
  footer p + p { margin-top: 8px; font-size: 15px; }


  .shelf-wrap { max-width: 760px; }
  .unit {
    --grain: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='480' height='140'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.004 0.16' numOctaves='3' seed='7'/><feColorMatrix values='0 0 0 0 0.09  0 0 0 0 0.04  0 0 0 0 0.01  0 0 0 1.7 -0.42'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
    background: var(--grain), linear-gradient(90deg, #4a2d19, #5d3b22 50%, #482c18);
    padding: 16px 16px 0; border-radius: 6px 6px 2px 2px;
    box-shadow: 0 40px 60px -20px rgba(0,0,0,.8), inset 0 0 0 1px rgba(255,255,255,.05), inset 0 2px 0 rgba(255,255,255,.12);
  }
  .cavity {
    display: flex; align-items: flex-end; gap: 2px; min-height: 306px; padding: 34px 22px 0;
    background: linear-gradient(#1c120b, #120b07);
    box-shadow: inset 0 22px 26px -12px rgba(0,0,0,.9), inset 10px 0 16px -8px rgba(0,0,0,.7), inset -10px 0 16px -8px rgba(0,0,0,.7);
  }
  .board {
    height: 22px; margin: 0 -16px;
    background: var(--grain), linear-gradient(#6a4528, #4a2e19 60%, #3c2413);
    box-shadow: inset 0 2px 0 rgba(255,255,255,.18), 0 3px 8px rgba(0,0,0,.5);
  }
  .board.base { height: 30px; box-shadow: inset 0 2px 0 rgba(255,255,255,.14); }

  .case {
    --lift: 0px;
    position: relative; flex: none; width: 36px; height: 262px; padding: 0; border: 0; cursor: pointer;
    background: #0c0c0c; border-radius: 2px; color: inherit; font: inherit;
    transform: translateY(var(--lift)); transition: transform .22s ease-out, box-shadow .22s;
    box-shadow: 3px 0 8px rgba(0,0,0,.55);
  }
  .case::after {
    content: ""; position: absolute; inset: 0; pointer-events: none; border-radius: 2px;
    background: linear-gradient(90deg, rgba(255,255,255,.42) 0, rgba(255,255,255,.1) 9%, transparent 22%, transparent 78%, rgba(255,255,255,.1) 91%, rgba(255,255,255,.34) 100%),
                linear-gradient(rgba(255,255,255,.18), transparent 12%, transparent 88%, rgba(255,255,255,.1));
  }
  .case:hover { --lift: -10px; }
  .unit.is-playing .case[aria-current="true"] { --lift: -26px; box-shadow: 3px 0 8px rgba(0,0,0,.55), 0 0 22px rgba(240,182,74,.25); }
  .case .paper {
    position: absolute; inset: 6px 4px; background: var(--bg); color: var(--fg);
    writing-mode: vertical-rl; display: flex; align-items: center; justify-content: space-between;
    padding: 12px 0; gap: 12px; line-height: 1; overflow: hidden;
  }
  .case .paper::before { content: ""; position: absolute; left: 0; right: 0; top: 0; height: 7px; background: var(--fg); opacity: .85; }
  .case .ttl { font-weight: 600; font-size: 16px; letter-spacing: .02em; margin-top: 14px; white-space: nowrap; }
  .case .art { font-size: 11px; letter-spacing: .16em; text-transform: uppercase; opacity: .85; white-space: nowrap; }

  .bookend { position: relative; flex: none; align-self: flex-end; width: 12px; height: 150px; margin-left: 8px;
    background: linear-gradient(90deg, #7d7d7d, #d2d2d2 45%, #707070); border-radius: 2px 2px 0 0; box-shadow: 2px 0 6px rgba(0,0,0,.5); }
  .bookend::after { content: ""; position: absolute; left: -62px; bottom: 0; width: 74px; height: 8px;
    background: linear-gradient(#c4c4c4, #6a6a6a); border-radius: 1px; }
  .shelf-now { margin-top: 22px; color: var(--text-2); font-size: 16px; min-height: 1.6em; }
  .shelf-now b { color: var(--accent); font-weight: 600; }

  @media (max-width: 560px) {
    .case { width: 32px; height: 228px; }
    .cavity { min-height: 272px; padding: 28px 14px 0; }
    .case .ttl { font-size: 14px; }
  }
  @media (prefers-reduced-motion: reduce) {
    html { scroll-behavior: auto; }
    .stage { transition: none; }
  }
</style>
</head>

  <nav aria-label="Main">
    <a href="#shelf">Shelf</a>

  </nav>
</header>

$("contactLine").append("Say hello at ", el("a", { href: "mailto:" + SITE.email, text: SITE.email }));

/* ---------- Streaming links ---------- */
LINKS.filter((l) => l.url).forEach((l) =>
  $("links").append(el("a", { href: l.url, target: "_blank", rel: "noopener", text: l.label }))
);

/* ---------- Player ---------- */
const audio = new Audio();
audio.preload = "metadata";
let idx = 0;
let playing = false;
const shelfCases = [];

function load(i) {
  idx = (i + TRACKS.length) % TRACKS.length;
  audio.src = TRACKS[idx].file;
  $("trackTitle").textContent = TRACKS[idx].title;
  $("msg").textContent = "";
  $("bar").value = 0;
  $("bar").style.setProperty("--p", "0%");
  $("cur").textContent = "0:00";
  $("dur").textContent = "0:00";
  updateShelf();
}
function setPlaying(v) {
  playing = v;
  $("hero").classList.toggle("is-playing", v);
  $("play").setAttribute("aria-label", v ? "Pause" : "Play");
  updateShelf();
}
function play() {
  const p = audio.play();
  if (p && p.catch) p.catch(() => {});
}
function toggle() { playing ? audio.pause() : play(); }

audio.addEventListener("play", () => setPlaying(true));
audio.addEventListener("pause", () => setPlaying(false));
audio.addEventListener("ended", () => { load(idx + 1); play(); });
audio.addEventListener("loadedmetadata", () => { $("dur").textContent = fmt(audio.duration); });
audio.addEventListener("timeupdate", () => {
  if (!audio.duration) return;
  const pct = (audio.currentTime / audio.duration) * 1000;
  $("bar").value = pct;
  $("bar").style.setProperty("--p", pct / 10 + "%");
  $("cur").textContent = fmt(audio.currentTime);
});
audio.addEventListener("error", () => {
  setPlaying(false);
  $("msg").textContent = "This song isn't uploaded yet. Add " + TRACKS[idx].file + " to your site.";
});

$("bar").addEventListener("input", (e) => {
  if (audio.duration) audio.currentTime = (e.target.value / 1000) * audio.duration;
  e.target.style.setProperty("--p", e.target.value / 10 + "%");
});
$("play").addEventListener("click", toggle);
$("prev").addEventListener("click", () => {
  if (audio.currentTime > 3) audio.currentTime = 0;
  else { const was = playing; load(idx - 1); if (was) play(); }
});
$("next").addEventListener("click", () => { const was = playing; load(idx + 1); if (was) play(); });

/* ---------- Shelf ---------- */
const SPINES = [
  ["#efe6d2", "#2a1d12"], ["#b8402f", "#fbeee4"], ["#27414f", "#e9dfc9"], ["#d8a23c", "#241707"],
  ["#4a5a3a", "#f1ead5"], ["#6f3450", "#f6e9ee"], ["#1e1e1e", "#f0b64a"], ["#cfd6d2", "#1d2a2c"]
];
function updateShelf() {
  shelfCases.forEach((c, n) => c.setAttribute("aria-current", n === idx ? "true" : "false"));
  $("unit").classList.toggle("is-playing", playing);
  const now = $("shelfNow");
  now.textContent = "";
  if (playing) now.append("Now playing: ", el("b", { text: TRACKS[idx].title }));
  else now.textContent = "Nothing playing. Pick a case.";
}
(function buildShelf() {
  const per = window.innerWidth < 600 ? 6 : 14;
  const unit = $("unit");
  const perRow = Math.min(per, TRACKS.length);
  unit.style.maxWidth = Math.max(380, perRow * 38 + 190) + "px";
  for (let start = 0; start < TRACKS.length; start += per) {
    const cavity = el("div", { class: "cavity" });
    TRACKS.slice(start, start + per).forEach((t, k) => {
      const i = start + k;
      const [bg, fg] = SPINES[i % SPINES.length];
      const c = el("button", { class: "case", type: "button", "aria-label": "Play " + t.title }, [
        el("span", { class: "paper", style: "--bg:" + bg + ";--fg:" + fg }, [
          el("span", { class: "ttl", text: t.title }),
          el("span", { class: "art", text: SITE.name })
        ])
      ]);
      c.addEventListener("click", () => { if (i === idx) toggle(); else { load(i); play(); } });
      shelfCases.push(c);
      cavity.append(c);
    });
    if (start + per >= TRACKS.length) cavity.append(el("span", { class: "bookend", "aria-hidden": "true" }));
    unit.append(cavity, el("div", { class: "board" }));
  }
  unit.lastChild.classList.add("base");
})();

load(0);

/* ---------- Spinning record ---------- */
const reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
const record = $("record");
const stage = $("stage");

if (!reduce) {
  let angle = 0, speed = 8, last = performance.now();
  (function frame(now) {
    const dt = Math.min(0.05, (now - last) / 1000);
    last = now;
    const target = playing ? 150 : 8;
    speed += (target - speed) * Math.min(1, dt * 2.2);
    angle = (angle + speed * dt) % 360;
    record.style.transform = "rotate(" + angle.toFixed(2) + "deg)";
    requestAnimationFrame(frame);
  })(last);

  window.addEventListener("pointermove", (e) => {
    const x = e.clientX / window.innerWidth - 0.5;
    const y = e.clientY / window.innerHeight - 0.5;
    stage.style.setProperty("--ry", (x * 14).toFixed(1) + "deg");
    stage.style.setProperty("--rx", (-y * 14).toFixed(1) + "deg");
  });
}
</script>
</body>
</html>
